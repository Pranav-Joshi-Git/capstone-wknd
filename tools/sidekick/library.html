<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WKND Block Library</title>
    <style>
      sidekick-library {
        position: fixed;
        inset: 0;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <script type="module" src="https://www.aem.live/tools/sidekick/library/index.js"></script>
    <script type="module">
      const library = document.createElement('sidekick-library');
      library.config = {
        base: '/tools/sidekick/library.json',
      };
      document.body.prepend(library);
    </script>
  </body>
</html>
